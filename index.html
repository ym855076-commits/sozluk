<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#124e3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jestler sözlügi</title>
<style>
:root{--g:#124e3f;--g2:#1b6d58;--gold:#d4af37;--bg:#f4f7f6;--card:#fff;--tx:#1d2b26;--mut:#5d6b66;--bd:#dbe4e0;--ok:#2f855a;--bad:#c53030}
[data-theme=dark]{--bg:#121816;--card:#1e2925;--tx:#e8efec;--mut:#9fb0a9;--bd:#2d3b35;--gold:#e0bd4a}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;border-bottom:4px solid var(--gold)}
.bar{display:flex;gap:6px;justify-content:flex-end}
.bar button{background:rgba(255,255,255,.18);border:1px solid #fff8;color:#fff;border-radius:18px;padding:6px 12px;font-size:.85rem;font-weight:700}
header h1{margin:8px 0 2px;font-size:1.35rem;text-align:center}
header p{margin:0;text-align:center;font-size:.85rem;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.modes{display:flex;gap:8px;margin-bottom:10px}
.modes button,.chip{flex:1;border:2px solid var(--g);background:var(--card);color:var(--tx);border-radius:22px;padding:10px;font-weight:700;font-size:.95rem}
.modes button.on,.chip.on{background:var(--g);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:0 0 auto;padding:7px 14px;font-size:.85rem}
input,select,textarea{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
input:focus{border-color:var(--gold);outline:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
.prog{margin:10px 0;font-size:.85rem;color:var(--mut)}
.pbar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:var(--mut);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.cb{padding:10px 12px;flex:1}
.cb h3{margin:0 0 4px;font-size:1.05rem;color:var(--g)}
[data-theme=dark] .cb h3{color:var(--gold)}
.cb p{margin:0;font-size:.9rem;color:var(--mut)}
.acts{display:flex;gap:6px;padding:0 12px 12px}
.acts button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:700;background:var(--g);color:#fff}
.acts .done{background:var(--ok)}
.acts .t{background:#2b6cb0;flex:0 0 46px}.acts .x{background:var(--bad);flex:0 0 46px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}
.q .ph{aspect-ratio:auto;min-height:120px;border-radius:10px;margin-bottom:10px;cursor:default;font-size:1.05rem;padding:8px;text-align:center}.q .ph img{height:auto;max-height:48vh}
.opts{display:grid;gap:8px;margin-top:8px}
.opts button{padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;font-weight:600}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.next{margin-top:12px;width:100%;padding:12px;border:0;border-radius:22px;background:var(--gold);color:#124e3f;font-weight:800;font-size:1rem}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.ov.on{display:flex}
.md{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.md img{width:100%;max-height:75vh;object-fit:contain}
.md label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.row button{border:0;border-radius:18px;padding:9px 18px;font-weight:700;background:var(--bd);color:var(--tx)}
.row .go{background:var(--gold);color:#124e3f}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:18px 12px 26px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div id="vQ" style="display:none"></div>
</div>
<footer id="ft"></footer>

let lang = 'ru', mode = 'dict', cat = 'all', learned = JSON.parse(localStorage.getItem('jl_learn')||'[]');
let custom = JSON.parse(localStorage.getItem('jl_cust')||'[]');
let allData = [...BASE, ...custom];

const $ = id => document.getElementById(id);
const t = {
  ru:{t:'Словарь жестов',s:'Изучение жестового языка',bT:' Turkmen ',bL:' Учитель ',bK:' Сброс ',mD:'Словарь',mQ:'Тест',add:'+ Добавить жест',
      p:'Выучено: ',sPh:'Поиск жеста',ft:'Жестовый словарь • 2026',
      aH:'Добавить жест',aC:'Категория',aN:'Название (на русском)',aD:'Перевод / описание',aX:'Отмена',aOk:'Сохранить',
      done:'Выучил', undx:'Не выучено', err:'Нет картинок для теста'},
  tk:{t:'Jestler sözlügi',s:'Jest dilini öwrenmek',bT:' Русский ',bL:' Mugallym ',bK:' Arassala ',mD:'Sözlük',mQ:'Synag',add:'+ Jest goşmak',
      p:'Öwrenildi: ',sPh:'Jest gözle',ft:'Jestler sözlügi • 2026',
      aH:'Jest goşmak',aC:'Kategoriýa',aN:'Ady (rus dilinde)',aD:'Terjimesi / düşündirişi',aX:'Ýatyr',aOk:'Sakla',
      done:'Öwrendim', undx:'Öwrenilmedi', err:'Synag üçin surat ýok'}
};

function renderUI(){
  document.documentElement.lang = lang;
  $('hT').innerText = t[lang].t;
  $('hS').innerText = t[lang].s;
  $('bT').innerText = t[lang].bT;
  $('bL').innerText = t[lang].bL;
  $('bK').innerText = t[lang].bK;
  $('mD').innerText = t[lang].mD;
  $('mQ').innerText = t[lang].mQ;
  $('add').innerText = t[lang].add;
  $('s').placeholder = t[lang].sPh;
  $('ft').innerText = t[lang].ft;
  $('aH').innerText = t[lang].aH;
  $('aC').innerText = t[lang].aC;
  $('aN').innerText = t[lang].aN;
  $('aD').innerText = t[lang].aD;
  $('aX').innerText = t[lang].aX;
  $('aOk').innerText = t[lang].aOk;

  let sSel = $('aCat'); sSel.innerHTML = '';
  for(let k in CATS){
    let opt = document.createElement('option'); opt.value = k; opt.innerText = CATS[k][lang]; sSel.appendChild(opt);
  }
}

function updateChips(){
  let html = `<button class="chip ${cat==='all'?'on':''}" onclick="setCat('all')">${lang==='ru'?'Все':'Hemmesi'}</button>`;
  for(let k in CATS){
    html += `<button class="chip ${cat===k?'on':''}" onclick="setCat('${k}')">${CATS[k][lang]}</button>`;
  }
  $('chips').innerHTML = html;
}

function setCat(c){ cat = c; updateChips(); renderDict(); }

function renderDict(){
  let q = $('s').value.toLowerCase();
  let filtered = allData.filter(item => {
    let matchCat = (cat === 'all' || item.c === cat);
    let matchQ = item.ru.toLowerCase().includes(q) || item.tk.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  let total = allData.length;
  let count = learned.length;
  $('pT').innerText = `${t[lang].p}${count} из ${total}`;
  $('pB').style.width = (total ? (count/total)*100 : 0) + '%';

  let html = '';
  if(filtered.length === 0){
    html = `<div class="empty">${lang==='ru'?'Ничего не найдено':'Hiç zat tapylmady'}</div>`;
  } else {
    filtered.forEach(item => {
      let isDone = learned.includes(item.id);
      let title = lang==='ru' ? item.ru : item.tk;
      let desc = lang==='ru' ? item.dru : item.dtk;
      html += `<div class="card">
        <div class="ph" onclick="openImg('${item.img}')"><img src="${item.img}" alt="" onerror="this.style.display='none'">✌️</div>
        <div class="cb">
          <h3>${title}</h3>
          ${desc ? `<p>${desc}</p>`:''}
        </div>
        <div class="acts">
          <button class="${isDone?'done':''}" onclick="toggleLearn('${item.id}')">${isDone?t[lang].done:t[lang].ak||t[lang].done}</button>
        </div>
      </div>`;
    });
  }
  $('grid').innerHTML = html;
}

function toggleLearn(id){
  if(learned.includes(id)){
    learned = learned.filter(x => x !== id);
  } else {
    learned.push(id);
  }
  localStorage.setItem('jl_learn', JSON.stringify(learned));
  renderDict();
}

function openImg(src){
  $('big').src = src;
  $('ovImg').classList.add('on');
}

let qList = [], qIdx = 0, score = 0;
function startTest(){
  qList = [...allData].sort(()=>Math.random()-.5).slice(0, 15);
  qIdx = 0; score = 0;
  nextQuestion();
}

function nextQuestion(){
  if(qIdx >= qList.length){
    $('vQ').innerHTML = `<div class="q"><h3>${lang==='ru'?'Тест завершен!':'Synag tamamlandy!'}</h3><p>${lang==='ru'?'Результат:':'Netije:'} ${score} / ${qList.length}</p><button class="next" onclick="startTest()">${lang==='ru'?'Пройти снова':'Täzeden başlamak'}</button></div>`;
    return;
  }
  let item = qList[qIdx];
  let wrongs = allData.filter(x => x.id !== item.id).sort(()=>Math.random()-.5).slice(0, 3);
  let opts = [...wrongs, item].sort(()=>Math.random()-.5);

  let html = `<div class="q">
    <div class="prog">${qIdx+1} / ${qList.length}</div>
    <div class="ph"><img src="${item.img}" alt="" onerror="this.style.display='none'"></div>
    <div class="opts">`;
  opts.forEach(o => {
    let val = lang==='ru' ? o.ru : o.tk;
    html += `<button onclick="checkAns(this, '${o.id}', '${item.id}')">${val}</button>`;
  });
  html += `</div></div>`;
  $('vQ').innerHTML = html;
}

function checkAns(btn, selectedId, correctId){
  let buttons = btn.parentNode.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  if(selectedId === correctId){
    btn.classList.add('ok');
    score++;
  } else {
    btn.classList.add('bad');
  }
  setTimeout(() => { qIdx++; nextQuestion(); }, 1000);
}

$('mD').onclick = () => {$('mD').classList.add('on'); $('mQ').classList.remove('on');$('vD').style.display='block'; $('vQ').style.display='none'; renderDict(); };$('mQ').onclick = () => { $('mQ').classList.add('on');$('mD').classList.remove('on'); $('vD').style.display='none';$('vQ').style.display='block'; startTest(); };

$('bT').onclick = () => { lang = lang === 'ru' ? 'tk' : 'ru'; renderUI(); updateChips(); renderDict(); };$('s').oninput = () => renderDict();

$('bL').onclick = () => {
  let p = prompt(lang==='ru'?'Введите пароль учителя:':'Mugallym parolyny giriziň:');
  if(p === PIN){
    $('add').style.display = 'block';
  } else if(p !== null) {
    alert(lang==='ru'?'Неверный пароль':'Ýalňyş parol');
  }
};

$('add').onclick = () =>$('ovAdd').classList.add('on');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => {
  b.closest('.ov').classList.remove('on');
});

$('aOk').onclick = () => {
  let title = $('aTitle').value.trim();
  let desc = $('aDesc').value.trim();
  let catVal = $('aCat').value;
  if(!title) return;
  let newItem = {id:'custom_'+Date.now(), c:catVal, n:999, ru:title, tk:title, dru:desc, dtk:desc, img:''};
  custom.push(newItem);
  allData.push(newItem);
  localStorage.setItem('jl_cust', JSON.stringify(custom));
  $('aTitle').value = ''; $('aDesc').value = '';$('ovAdd').classList.remove('on');
  renderDict();
};

$('bK').onclick = () => {
  if(confirm(lang==='ru'?'Сбросить сохраненный прогресс?':'Bellikleri arassalamalymi?')){
    localStorage.removeItem('jl_learn');
    learned = [];
    renderDict();
  }
};

renderUI();
updateChips();
renderDict();
</script>
