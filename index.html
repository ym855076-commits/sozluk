<style>
:root{--g:#124e3f;--g2:#1b6d58;--gold:#d4af37;--bg:#f4f7f6;--card:#fff;--tx:#1d2b26;--mut:#5d6b66;--bd:#dbe4e0;--ok:#2f855a;--bad:#c53030}
[data-theme=dark]{--bg:#121816;--card:#1e2925;--tx:#e8efec;--mut:#9fb0a9;--bd:#2d3b35;--gold:#e0bd4a}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;border-bottom:4px solid var(--gold)}
.bar{display:flex;gap:6px;justify-content:flex-end}
.bar button{background:rgba(255,255,255,.18);border:1px solid #fff8;color:#fff;border-radius:18px;padding:6px 12px;font-size:.85rem;font-weight:700}
header h1{margin:8px 0 2px;font-size:1.35rem;text-align:center}
header p{margin:0;text-align:center;font-size:.85rem;opacity:.9}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.modes{display:flex;gap:8px;margin-bottom:10px}
.modes button,.chip{flex:1;border:2px solid var(--g);background:var(--card);color:var(--tx);border-radius:22px;padding:10px;font-weight:700;font-size:.95rem}
.modes button.on,.chip.on{background:var(--g);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:0 0 auto;padding:7px 14px;font-size:.85rem}
input,select,textarea{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
input:focus{border-color:var(--gold);outline:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
.prog{margin:10px 0;font-size:.85rem;color:var(--mut)}
.pbar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:var(--mut);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:contain;background:#fff}
.cb{padding:10px 12px;flex:1}
.cb h3{margin:0 0 4px;font-size:1.05rem;color:var(--g)}
[data-theme=dark] .cb h3{color:var(--gold)}
.cb p{margin:0;font-size:.9rem;color:var(--mut)}
.acts{display:flex;gap:6px;padding:0 12px 12px}
.acts button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:700;background:var(--g);color:#fff}
.acts .done{background:var(--ok)}
.acts .t{background:#2b6cb0;flex:0 0 46px}.acts .x{background:var(--bad);flex:0 0 46px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}
.q .ph{aspect-ratio:auto;min-height:120px;border-radius:10px;margin-bottom:10px;cursor:default;font-size:1.05rem;padding:8px;text-align:center}.q .ph img{height:auto;max-height:48vh}
.opts{display:grid;gap:8px;margin-top:8px}
.opts button{padding:13px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;font-weight:600}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.next{margin-top:12px;width:100%;padding:12px;border:0;border-radius:22px;background:var(--gold);color:#124e3f;font-weight:800;font-size:1rem}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.ov.on{display:flex}
.md{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.md img{width:100%;max-height:75vh;object-fit:contain}
.md label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.row button{border:0;border-radius:18px;padding:9px 18px;font-weight:700;background:var(--bd);color:var(--tx)}
.row .go{background:var(--gold);color:#124e3f}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:18px 12px 26px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  texts();
  const all=items(),q=$('s').value.trim().toLowerCase();
  $('chips').innerHTML=[['all',t().all],...Object.entries(CATS).map(([k,v])=>[k,v[lang]])].map(([k,n])=>`<button class="chip ${cat===k?'on':''}" data-cat="${k}">${n}</button>`).join('');
  const n=all.filter(x=>learned.has(x.id)).length;
  $('pT').textContent=t().prog(n,all.length);$('pB').style.width=(all.length?n/all.length*100:0)+'%';
  const list=all.filter(x=>(cat==='all'||x.c===cat)&&(title(x)+' '+desc(x)).toLowerCase().includes(q));
  $('grid').innerHTML=list.length?list.map(x=>{const p=src(x);const L=learned.has(x.id);return `<div class="card">
   <div class="ph" data-zoom="${x.id}">${p?`<img src="${esc(p)}" alt="" loading="lazy" onerror="this.parentNode.textContent='🤟'">`:'🤟'}</div>
   <div class="cb"><h3>${esc(title(x))}</h3><p>${esc(desc(x))}</p></div>
   <div class="acts"><button class="${L?'done':''}" data-learn="${x.id}">${L?t().again:t().learn}</button>${teacher?`<button class="t" data-photo="${x.id}">📷</button><button class="x" data-del="${x.id}">🗑</button>`:''}</div></div>`}).join(''):`<div class="empty">${t().none}</div>`;
}

/* тест */
let Q=null;
function startQuiz(){
  const all=items();if(all.length<4){$('vQ').innerHTML=`<div class="empty">${t().need}</div>`;return}
  const pool=[...all].sort(()=>Math.random()-.5).slice(0,10);
  Q={pool,i:0,score:0,done:false};nextQ();
}
function nextQ(){
  if(Q.i>=Q.pool.length){$('vQ').innerHTML=`<div class="q"><h2>${t().res(Q.score,Q.pool.length)}</h2><button class="next" id="qAgain">${t().again2}</button></div>`;$('qAgain').onclick=startQuiz;return}
  const x=Q.pool[Q.i],p=src(x);Q.done=false;
  const wrong=items().filter(y=>y.id!==x.id).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[x,...wrong].sort(()=>Math.random()-.5);
  $('vQ').innerHTML=`<div class="q"><div class="prog">${Q.i+1} / ${Q.pool.length}</div>
   <div class="ph">${p?`<img src="${esc(p)}" alt="" onerror="this.parentNode.textContent='${esc(desc(x)).replace(/'/g,'’')}'">`:esc(desc(x))}</div>
   <b>${p?t().q:t().qd}</b><div class="opts">${opts.map(o=>`<button data-a="${o.id}">${esc(lang==='tk'?o.tk:o.ru)}</button>`).join('')}</div>
   <button class="next" id="qNext" style="display:none">${t().next}</button></div>`;
  $('qNext').onclick=()=>{Q.i++;nextQ()};
}
$('vQ').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!Q||Q.done)return;Q.done=true;
  const x=Q.pool[Q.i],ok=b.dataset.a===x.id;if(ok)Q.score++;
  document.querySelectorAll('#vQ [data-a]').forEach(o=>{if(o.dataset.a===x.id)o.classList.add('ok')});
  if(!ok)b.classList.add('bad');$('qNext').style.display='block';
});

/* события */
function setMode(m){mode=m;$('mD').classList.toggle('on',m==='D');$('mQ').classList.toggle('on',m==='Q');$('vD').style.display=m==='D'?'':'none';$('vQ').style.display=m==='Q'?'':'none';texts();if(m==='Q')startQuiz()}
$('mD').onclick=()=>setMode('D');$('mQ').onclick=()=>setMode('Q');
$('bT').onclick=()=>{theme=theme==='dark'?'light':'dark';save('theme',theme);texts()};
$('bL').onclick=()=>{lang=lang==='tk'?'ru':'tk';save('lang',lang);render();if(mode==='Q')startQuiz()};
$('bK').onclick=()=>{if(teacher){teacher=false}else{const p=prompt(t().pin);if(p===null)return;if(p!==PIN){alert(t().bad);return}teacher=true}render()};
$('bS').onclick=()=>$('ovShare').classList.add('on');
$('shCopy').onclick=()=>{$('shLink').select();try{navigator.clipboard.writeText($('shLink').value)}catch(e){document.execCommand('copy')};$('shCopy').textContent=t().copied;setTimeout(()=>$('shCopy').textContent=t().copy,1500)};
$('s').oninput=render;
$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;render()}};
$('add').onclick=()=>$('ovAdd').classList.add('on');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('on'));
document.querySelectorAll('.ov').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('on')});
$('aOk').onclick=()=>{
  const n=$('aTitle').value.trim();if(!n)return;const d=$('aDesc').value.trim();
  custom.push({id:'u'+Date.now(),c:$('aCat').value,ru:n,tk:n,dru:d,dtk:d});save('custom',custom);
  $('aTitle').value='';$('aDesc').value='';$('ovAdd').classList.remove('on');cat='all';render();
};
const pick=document.createElement('input');pick.type='file';pick.accept='image/*';pick.style.display='none';document.body.appendChild(pick);let pickId=null;
pick.onchange=async()=>{const f=pick.files[0];if(!f||!pickId)return;const d=await shrink(f);photos[pickId]=d;try{await idb('put',pickId,d)}catch(e){}pick.value='';render()};
$('grid').onclick=e=>{
  let b;
  if(b=e.target.closest('[data-learn]')){const id=b.dataset.learn;learned.has(id)?learned.delete(id):learned.add(id);save('learned',[...learned]);render()}
  else if(b=e.target.closest('[data-photo]')){pickId=b.dataset.photo;pick.click()}
  else if(b=e.target.closest('[data-del]')){const id=b.dataset.del;if(!confirm(t().del))return;
    if(id[0]==='u'){custom=custom.filter(x=>x.id!==id);save('custom',custom);idb('del',id).catch(()=>{});delete photos[id]}else{hidden.add(id);save('hidden',[...hidden])}
    render()}
  else if(b=e.target.closest('[data-zoom]')){const x=items().find(y=>y.id===b.dataset.zoom),p=x&&src(x);if(p){$('big').src=p;$('ovImg').classList.add('on')}}
};

/* офлайн */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.onLine)BASE.forEach(x=>{if(x.img)fetch(x.img).catch(()=>{})}); // прогрев кэша фото
loadPhotos().then(render);render();
</script>
</body>
